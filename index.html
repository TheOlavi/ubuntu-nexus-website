<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ubuntu Nexus Group — Trading · Advisory · Foods · Arts · Events</title>
<meta name="description" content="Ubuntu Nexus Group : trading, advisory, foods, arts, events — le pont entre l'Afrique de l'Ouest et l'Europe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--deep:#042C53;--blue:#185FA5;--mid:#378ADD;--light:#B5D4F4;--pale:#E6F1FB;--gold:#9a7c3a;--ink:#1a1a1a;--g7:#444;--g5:#777;--g1:#f5f4f1;--c:#042C53;--top:64px;
--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--deep);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}
.layer{position:fixed;inset:0;display:none}
.layer.on{display:block}

/* ── 1. SPLASH ── */
#splash{background:radial-gradient(ellipse at 50% 40%,#0b4a85 0%,var(--deep) 65%);color:#fff;text-align:center;overflow:hidden}
#splash .ring{position:absolute;left:50%;top:42%;border:1px solid rgba(181,212,244,.18);border-radius:50%;transform:translate(-50%,-50%);animation:pulse 9s ease-in-out infinite}
#splash .ring:nth-child(1){width:360px;height:360px}#splash .ring:nth-child(2){width:620px;height:620px;animation-delay:-3s}#splash .ring:nth-child(3){width:900px;height:900px;animation-delay:-6s}#splash .ring:nth-child(4){width:1250px;height:1250px;animation-delay:-1.5s}
@keyframes pulse{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.96)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
.sp-in{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:6px}
.sp-in img{width:clamp(90px,14vw,140px);margin-bottom:18px}
.sp-in h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.2rem,6vw,4rem);letter-spacing:.02em;line-height:1.05}
.sp-in .motto{font-family:var(--serif);font-style:italic;font-size:clamp(1.2rem,2.8vw,1.8rem);color:var(--light);margin-top:10px}
.sp-in .div5{font-size:.78rem;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-top:18px}
.enter{margin-top:42px;padding:16px 38px;border:1px solid var(--light);color:#fff;letter-spacing:.2em;text-transform:uppercase;font-size:.8rem;font-weight:500;transition:.25s;animation:float 3s ease-in-out infinite}
.enter:hover,.enter:focus-visible{background:#fff;color:var(--deep);outline:none}
@keyframes float{50%{transform:translateY(-5px)}}
.lang{display:flex;gap:2px;font-size:.75rem;letter-spacing:.12em}
.lang button{padding:6px 10px;border:1px solid rgba(255,255,255,.35);color:inherit;opacity:.7}
.lang button.on{background:#fff;color:var(--deep);opacity:1;border-color:#fff}
#splash .lang{position:absolute;top:20px;right:20px;color:#fff}

/* ── TOPBAR ── */
#top{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:30;background:var(--deep);color:#fff;display:none;align-items:center;gap:22px;padding:0 24px;border-bottom:4px solid var(--c);transition:border-color .4s}
#top.on{display:flex}
#top .brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.3rem;font-weight:500}
#top .brand img{height:30px}
#top nav{margin-left:auto;display:flex;gap:6px;align-items:center}
#top nav button.lk{padding:8px 12px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
#top nav button.lk:hover,#top nav button.lk.on{opacity:1;box-shadow:inset 0 -2px var(--light)}
#top nav .cta{background:var(--mid);padding:9px 16px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;font-weight:500}
#top .lang{margin-left:8px}

/* ── 2. CHOOSER ── */
#choose{top:var(--top);background:var(--g1);overflow:auto}
.ch-in{max-width:1180px;margin:0 auto;padding:clamp(28px,5vw,64px) 24px 40px}
.ch-in h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.9rem,4.5vw,3rem);color:var(--deep);text-align:center;line-height:1.15}
.ch-in .sub{text-align:center;color:var(--g5);margin:10px 0 34px;font-size:.95rem}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:#fff;text-align:left;display:flex;flex-direction:column;border-bottom:5px solid var(--c);box-shadow:0 1px 3px rgba(4,44,83,.08);transition:transform .25s,box-shadow .25s;overflow:hidden}
.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 14px 30px rgba(4,44,83,.18);outline:none}
.card .im{aspect-ratio:16/9;background:var(--c);position:relative;overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .im img{transform:scale(1.05)}
.card .im.w{background:#fff}.card .im.w img{object-fit:contain;padding:10px}
.card:first-child{grid-column:1/-1;flex-direction:row;border-bottom-width:8px}
.card:first-child .im{flex:0 0 58%;aspect-ratio:auto;min-height:360px;background:#fff}
.card:first-child .tx{display:flex;flex-direction:column;justify-content:center;padding:32px 40px;background:var(--c);color:#fff}
.card:first-child .n{color:#fff;opacity:.85}.card:first-child h3{font-size:3.4rem;color:#fff}.card:first-child p{font-size:1.05rem;color:#fff;opacity:.92}
.card:first-child .more{display:inline-block;margin-top:18px;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid #fff;align-self:flex-start;padding-bottom:2px}
.collage{display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:1fr 1fr;gap:3px;width:100%;height:100%}
.collage img{width:100%;height:100%;object-fit:cover}.collage img:first-child{grid-row:1/3}
.card .im svg{position:absolute;inset:0;width:100%;height:100%}
.card .tx{padding:16px 20px 20px}
.card .n{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--c);font-weight:600}
.card h3{font-family:var(--serif);font-weight:500;font-size:1.7rem;color:var(--deep);margin:2px 0 4px}
.card p{font-size:.88rem;color:var(--g7);line-height:1.45}
.foot{text-align:center;font-size:.76rem;color:var(--g5);margin-top:34px}
.foot a{cursor:pointer;text-decoration:underline;margin:0 6px}

/* ── 3. PANELS ── */
#panel{top:var(--top);background:color-mix(in srgb,var(--c) 5%,#fff);overflow:auto;scroll-behavior:smooth}
#panel.on{animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
.ph{background:var(--c);color:#fff;padding:22px 24px 42px;position:relative}
.ph-in,.pb{max-width:1100px;margin:0 auto}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.bc{font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85;flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bc button{text-transform:uppercase;letter-spacing:.1em;text-decoration:underline;text-underline-offset:3px;opacity:.9}
.bc b{font-weight:600}
.tb{border:1px solid rgba(255,255,255,.5);padding:8px 14px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.tb:hover,.tb:focus-visible{background:#fff;color:var(--c);outline:none}
.ph h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.2rem,5.5vw,3.8rem);line-height:1.05}
.ph .kick{font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;opacity:.75;margin-bottom:8px}
.ph .lead{max-width:760px;margin-top:16px;font-size:1.02rem;line-height:1.65;opacity:.93}
.pb{padding:36px 24px 60px}
.pb h2{font-family:var(--serif);font-weight:500;font-size:2rem;color:var(--c);margin:38px 0 6px;line-height:1.1}
.pb h2:first-child{margin-top:0}
.pb h2+.d{color:var(--g7);margin-bottom:18px;max-width:760px;line-height:1.6}
.sec-lbl{display:inline-block;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:var(--c);padding:4px 10px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.box{background:#fff;border-top:4px solid var(--c);padding:22px;box-shadow:0 1px 3px rgba(4,44,83,.07);display:flex;flex-direction:column}
.box h3{font-family:var(--serif);font-weight:500;font-size:1.45rem;color:var(--deep);line-height:1.15}
.box .s{font-size:.78rem;color:var(--c);font-style:italic;margin:3px 0 10px}
.box p{font-size:.9rem;line-height:1.6;color:var(--g7)}
.box .pm{font-size:.84rem;margin-top:8px;line-height:1.5}
.box .pm b{color:var(--c);font-weight:600}
.box .num{font-family:var(--serif);font-size:2.2rem;color:var(--c);line-height:1}
.box ul{margin:10px 0 0 18px;font-size:.88rem;line-height:1.7;color:var(--g7)}
.pimg{margin:-22px -22px 16px;height:210px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid #eee}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg.ctn img{object-fit:contain;padding:8px}
.pimg.ph0{background:repeating-linear-gradient(45deg,var(--pale),var(--pale) 10px,#fff 10px,#fff 20px);color:var(--g5);font-size:.78rem}
.btn{margin-top:auto;align-self:flex-start;background:var(--c);color:#fff;padding:11px 20px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.btn:hover,.btn:focus-visible{filter:brightness(1.18);outline:none}
.box .btn{margin-top:16px}
.btn.line{background:none;border:1px solid var(--c);color:var(--c)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips span{font-size:.7rem;background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--c);padding:4px 9px;font-weight:500}
.sub2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;margin-top:4px}
.big{background:var(--c);color:#fff;text-align:left;display:flex;flex-direction:column;overflow:hidden;transition:transform .25s,box-shadow .25s}
.big:hover,.big:focus-visible{transform:translateY(-4px);box-shadow:0 16px 32px rgba(4,44,83,.25);outline:none}
.big .im{height:230px;overflow:hidden;background:#fff}
.big .im img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.big:hover .im img{transform:scale(1.05)}
.big .tx{padding:22px 24px 26px}
.big h3{font-family:var(--serif);font-weight:500;font-size:2rem}
.big .sb{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85;margin:4px 0 10px}
.big p{font-size:.92rem;line-height:1.55;opacity:.92}
.big .go{display:inline-block;margin-top:14px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid #fff;padding-bottom:2px}
.band{background:var(--c);color:#fff;padding:26px;margin-top:34px;display:flex;gap:22px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.band p{font-family:var(--serif);font-size:1.5rem;max-width:640px;line-height:1.3}
.band .btn{background:#fff;color:var(--c);margin:0}
.vivi{display:flex;gap:24px;align-items:center;background:#fff;padding:24px;border-left:6px solid var(--c);text-decoration:none;flex-wrap:wrap;margin-top:20px}
.vivi img{width:240px;max-width:100%}
.vivi h3{font-family:var(--serif);font-size:1.8rem;color:var(--deep)}
.vivi p{color:var(--g7);line-height:1.6;max-width:520px;margin:6px 0 10px}
.vivi span{color:var(--c);font-weight:600;font-size:.85rem}
.loa{display:flex;gap:30px;flex-wrap:wrap;margin-top:12px}
.loa div{min-width:90px}.loa small{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--g5)}

/* form */
.form{background:#fff;padding:28px;border-top:4px solid var(--c);display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form .sp{grid-column:1/-1}
.form label{display:block;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--g7);margin-bottom:5px;font-weight:500}
.form input,.form select,.form textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #cfd6de;background:#fbfcfd;border-radius:0}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--mid);border-color:var(--mid)}
.form textarea{min-height:110px;resize:vertical}
.cons{display:flex;gap:10px;align-items:flex-start;font-size:.82rem;color:var(--g7);line-height:1.5}
.cons input{width:auto;margin-top:3px}
.cons label{text-transform:none;letter-spacing:0;font-size:.82rem;margin:0}
.msg{display:none;padding:14px;margin-top:6px;font-size:.88rem}
.msg.err{background:#fde8e8;color:#8a1c1c}.msg.ok{background:#e4f4ea;color:#17613a;display:block;padding:24px;font-size:1rem}
.small{font-size:.76rem;color:var(--g5);line-height:1.6;margin-top:14px}
.small a{cursor:pointer;text-decoration:underline}

/* legal */
#legal{position:fixed;inset:0;z-index:50;background:rgba(4,44,83,.8);display:none;align-items:center;justify-content:center;padding:20px}
#legal.on{display:flex}
#legal .m{background:#fff;max-width:720px;max-height:86vh;overflow:auto;padding:30px;position:relative;line-height:1.6;font-size:.9rem;color:var(--g7)}
#legal h3{font-family:var(--serif);font-size:1.8rem;color:var(--deep);margin-bottom:10px}
#legal h4{color:var(--deep);margin:14px 0 2px;font-size:.9rem}
#legal .x{position:absolute;top:10px;right:14px;font-size:1.4rem}

@media(max-width:860px){
 .cards{grid-template-columns:1fr 1fr}.card .im{aspect-ratio:4/3}
 .card:first-child{flex-direction:column}.card:first-child .im{flex:none;min-height:240px;width:100%}.card:first-child .tx{padding:24px}.card:first-child h3{font-size:2.6rem}
 #top nav button.lk{display:none}#top .brand span{display:none}
 .form{grid-template-columns:1fr}
}
@media(max-width:520px){.cards{grid-template-columns:1fr}#top{padding:0 14px;gap:10px}.ph{padding:18px 16px 34px}.pb{padding:28px 16px 50px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<section id="splash" class="layer on">
  <span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span>
  <div class="lang" data-lang-sw></div>
  <div class="sp-in">
    <img id="spLogo" alt="Ubuntu Nexus">
    <h1>Ubuntu Nexus Group</h1>
    <p class="motto">We grow because you grow.</p>
    <p class="div5">Trading · Advisory · Foods · Arts · Events</p>
    <button class="enter" id="enterBtn"></button>
  </div>
</section>

<header id="top">
  <button class="brand" onclick="go('splash')" aria-label="Ubuntu Nexus Group"><img id="tpLogo" alt=""><span>Ubuntu Nexus Group</span></button>
  <nav id="nav"></nav>
  <div class="lang" data-lang-sw></div>
</header>

<section id="choose" class="layer"></section>
<section id="panel" class="layer" aria-live="polite"></section>

<div id="legal"><div class="m" id="legalBox"></div></div>

 [x('Distribution','Distribution'),x('Japon','Japan'),x('L\'un des marchés les plus exigeants au monde pour les ingrédients naturels : cible à forte valeur pour notre gamme traçable et certifiée.','One of the world\'s most discerning markets for natural ingredients: a high-value target for our traceable, certified range.')],
 [x('Distribution','Distribution'),x('Corée du Sud','South Korea'),x('Bien-être, cosmétique et nutraceutique en plein essor : demande soutenue pour des botaniques africains premium en clean label.','Booming wellness, cosmetics and nutraceutical industries: strong demand for premium clean-label African botanicals.')]

 ${cta(x('Prêt à vous approvisionner en Afrique de l\'Ouest ? Devis personnalisé en 48 h.','Ready to source from West Africa? Tailored quotation within 48 h.'))}`}),
about:()=>({
 kick:x('Notre philosophie','Our philosophy'),title:x('Je suis parce que nous sommes.','I am because we are.'),
 lead:x('« Ubuntu Nexus Group est né d\'un constat de terrain et d\'une conviction personnelle — construire la structure qui ferait le pont entre les producteurs africains et les marchés européens. »','“Ubuntu Nexus Group was born from field observation and personal conviction — to build the structure that would bridge African producers and European markets.”'),
 body:`<p class="d" style="max-width:780px;margin-bottom:22px;color:var(--g7);line-height:1.7">${T(x('Ubuntu Nexus Group est constitué au Luxembourg (SARL-S) et opère en France, au Benelux, en Suisse et en Afrique de l\'Ouest (Bénin, Togo, Côte d\'Ivoire, Sénégal). Il est structuré autour de cinq pôles complémentaires — Trading, Advisory, Foods, Arts et Events — chacun autonome, tous tournés vers une vision commune : être le partenaire de confiance entre l\'Afrique et l\'Europe.','Ubuntu Nexus Group is incorporated in Luxembourg (SARL-S) and operates across France, Benelux, Switzerland and West Africa (Bénin, Togo, Côte d\'Ivoire, Senegal). It is built around five complementary divisions — Trading, Advisory, Foods, Arts and Events — each autonomous, all sharing one vision: being the trusted partner between Africa and Europe.'))}</p>
 <div class="grid">
 ${info(x('Connexion','Connection'),x('Nous créons les ponts là où ils manquent — entre marchés, producteurs et distributeurs.','We build bridges where they are missing — between markets, producers and distributors.'))}
 ${info(x('Rigueur','Rigour'),x('Négoce et conseil exigent une excellence opérationnelle sans compromis. Nos engagements sont tenus.','Trading and consulting demand uncompromising operational excellence. Our commitments are kept.'))}
 ${info(x('Croissance partagée','Shared growth'),x('Nous ne prospérons que si nos partenaires prospèrent. Chaque engagement crée une valeur durable.','We only prosper when our partners prosper. Every engagement creates lasting value.'))}
 ${info(x('Vision long terme','Long-term vision'),x('Notre ambition n\'est pas la transaction, c\'est la relation.','Our ambition is not the transaction — it is the relationship.'))}
 </div>`}),
quote:()=>({
 kick:x('Contact','Contact'),title:x('Parlons affaires.','Let\'s talk business.'),

 <div class="sp"><button class="btn" type="submit" style="margin:0">${T(x('Envoyer ma demande →','Send my request →'))}</button>

/* ── Router (hash = bookmarkable, browser Back works) ── */
let formState={},view='splash';
const route=()=>{const h=location.hash.slice(1);return (h==='splash'||h==='choose'||V[h])?h:'splash'};
function go(v){if(location.hash.slice(1)===v)render();else location.hash=v}
function up(v){go(PARENT[v]||'choose')}
function askQuote(prod,svc){formState={products:prod,service:svc||(CAT.fruits.concat(CAT.oils).some(p=>T(p.n)===prod)?'trading-soft':'trading-diaspora')};go('quote')}

function render(){
 const v=route();view=v;
 if(v==='quote')saveForm();
 const col=COL[v]||COL.choose;document.body.style.setProperty('--c',col);
 $('#splash').classList.toggle('on',v==='splash');
 $('#top').classList.toggle('on',v!=='splash');
 $('#choose').classList.toggle('on',v!=='splash');
 $('#panel').classList.remove('on');
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-lang-sw]').forEach(e=>e.innerHTML=['fr','en'].map(l=>`<button class="${l===lang?'on':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join(''));
 $('#enterBtn').textContent=T(UI.enter);
 $('#nav').innerHTML=['markets','about'].map(k=>`<button class="lk ${v===k?'on':''}" onclick="go('${k}')">${T(UI[k])}</button>`).join('')+`<button class="cta" onclick="go('quote')">${T(UI.quote)}</button>`;
 $('#choose').innerHTML=`<div class="ch-in"><h2>${T(UI.ask)}</h2><p class="sub">${T(UI.askSub)}</p><div class="cards">${DIVS.map((d,i)=>{const o=V[d]();return `<button class="card" style="--c:${COL[d]}" onclick="go('${d}')"><div class="im ${d==='trading'?'':'w'}">${heroImg(d)}</div><div class="tx"><div class="n">${T(UI.div)} 0${i+1}</div><h3>${d[0].toUpperCase()+d.slice(1)}</h3><p>${T(TAG[d])}</p>${d==='trading'?`<span class="more">${T(UI.discover)} →</span>`:''}</div></button>`}).join('')}</div>
 <p class="foot"><a onclick="go('markets')">${T(UI.markets)}</a>·<a onclick="go('about')">${T(UI.about)}</a>·<a onclick="go('quote')">${T(UI.quote)}</a><br><br><a onclick="legal('notice')">${T(UI.legal)}</a>·<a onclick="legal('privacy')">${T(UI.privacy)}</a><br>© 2026 Ubuntu Nexus Group SARL-S — Luxembourg</p></div>`;
 if(V[v]){
  const o=V[v](),chain=[];for(let k=v;k&&k!=='choose';k=PARENT[k])chain.unshift(k);
  const bc=`<button onclick="go('choose')">${T(UI.home)}</button>`+chain.map((k,i)=>i<chain.length-1?` › <button onclick="go('${k}')">${T(NAME[k])}</button>`:` › <b>${T(NAME[k])}</b>`).join('');
  const p=$('#panel');
  p.innerHTML=`<div class="ph"><div class="ph-in"><div class="tools"><div class="bc">${bc}</div><button class="tb" onclick="up('${v}')">${T(UI.back)}</button><button class="tb" onclick="go('choose')">${T(UI.close)}</button></div><div class="kick">${T(o.kick)}</div><h1>${T(o.title)}</h1><p class="lead">${T(o.lead)}</p></div></div><div class="pb">${o.body}</div>`;
  p.scrollTop=0;p.classList.add('on');restoreForm();
 }
}
function saveForm(){const f=$('#qf');if(f){new FormData(f).forEach((val,k)=>formState[k]=val)}}
function restoreForm(){const f=$('#qf');if(!f)return;Object.entries(formState).forEach(([k,val])=>{const e=f.elements[k];if(e&&e.type!=='checkbox')e.value=val});}
function setLang(l){lang=l;render()}
$('#enterBtn').onclick=()=>go('choose');
window.addEventListener('hashchange',render);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#legal').classList.contains('on'))$('#legal').classList.remove('on');else if(V[view])up(view)}});
const TAG={trading:x('Soft commodities & gamme Diaspora d\'Afrique de l\'Ouest','West African soft commodities & Diaspora range'),advisory:x('RSE, durabilité & finance durable','CSR, sustainability & sustainable finance'),foods:x('Du champ à l\'étalage — VIVI FLAVORS','From field to shelf — VIVI FLAVORS'),arts:x('Art contemporain africain en Europe','Contemporary African art in Europe'),events:x('Expériences privées sur mesure','Bespoke private experiences')};

/* ── Form ── */
async function submitForm(e){
 e.preventDefault();const f=e.target,b=f.querySelector('button[type=submit]'),er=$('#qerr');er.style.display='none';b.disabled=true;
 const d=new FormData(f);
 const payload={blocks:[{type:'sender',properties:{email:d.get('email')||'',firstName:d.get('firstname')||'',lastName:d.get('lastname')||'',company:d.get('company')||''}},
  {type:'text',name:'phone',value:d.get('phone')||''},{type:'text',name:'country',value:d.get('country')||''},{type:'select',name:'service',value:d.get('service')||''},
  {type:'text',name:'products',value:d.get('products')||''},{type:'text',name:'message',value:d.get('message')||''},{type:'checkbox',name:'consent',value:d.get('consent')?'yes':'no'}]};
 try{const r=await fetch(FORM_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});
  if(r.ok){f.style.display='none';$('#qok').style.display='block';formState={}}else{er.style.display='block';b.disabled=false}}
 catch(_){er.style.display='block';b.disabled=false}
}

};
function legal(k){$('#legalBox').innerHTML=`<button class="x" onclick="$('#legal').classList.remove('on')" aria-label="Close">✕</button>`+T(LEG[k]);$('#legal').classList.add('on')}
$('#legal').onclick=e=>{if(e.target.id==='legal')e.target.classList.remove('on')};

$('#spLogo').src=IMG.logo;$('#tpLogo').src=IMG.logo;
render();
</script>
</body>
